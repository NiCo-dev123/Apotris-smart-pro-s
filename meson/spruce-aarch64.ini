# Trimui Smart Pro S / Allwinner A133P / PortMaster
#
# This tracked profile contains no host-specific paths. Pair it with the
# ignored spruce-aarch64.local.ini generated for the local compatibility
# sysroot when configuring a build.

[binaries]
c = 'aarch64-linux-gnu-gcc-10'
cpp = 'aarch64-linux-gnu-g++-10'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'aarch64-linux-gnu-pkg-config'
cmake = 'cmake'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a55'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=armv8-a']
cpp_args = c_args
c_link_args = c_args
cpp_link_args = c_args
