# Trimui Smart Pro S / Spruce OS / PortMaster
#
# This file targets the 32-bit userspace shipped by Spruce OS.  Install a
# GLIBC 2.28-compatible armhf toolchain before using it; in particular, do not
# substitute an aarch64 compiler just because the A133P CPU supports 64-bit.
#
# Example:
#   meson setup build-spruce --cross-file meson/spruce-armhf.ini \
#     -Dportmaster=true --buildtype=release

[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'arm-linux-gnueabihf-pkg-config'
cmake = 'cmake'

[host_machine]
# Spruce is a GNU/Linux userland. PortMaster behaviour is selected separately
# with -Dportmaster=true; this lets third-party Meson subprojects select their
# supported arm-linux configurations.
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[properties]
# Target executables cannot run on the x86_64 build host.
needs_exe_wrapper = true

[built-in options]
# The A133P executes this ARMv7 hard-float ABI code and provides NEON/VFPv4.
c_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard']
cpp_args = c_args
c_link_args = c_args
cpp_link_args = c_args
